name: Mise à jour depuis l'app d'origine


on:
  schedule:
cron: '17 */6 * * *'
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
uses: actions/checkout@v4
        with:
          repository: emmabaltz347-lang/journal-xauusd
          ref: main
uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
run: npm ci
run: npm test
run: echo "APP_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
id: deployment
        uses: actions/deploy-pages@v4
